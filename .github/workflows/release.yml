name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build portable zip
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package_app.ps1
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MI2-AIO-*-win64.zip
            dist/SHA256.txt
